# Splitter K8s ресурсы
#
# Применять в порядке:
#   1. kubectl apply -f secrets.example.yaml   (заменить значения на реальные)
#   2. kubectl apply -f configmap.yaml
#   3. Job создаётся автоматически Jenkins (Jenkinsfile) или вручную:
#      kubectl apply -f job-once.yaml
#
# Namespace: chessverse

---
# ── 1. MinIO credentials ──────────────────────────────────────────────────────
# Создать один раз:
#   kubectl create secret generic splitter-minio-credentials \
#     --namespace=chessverse \
#     --from-literal=AWS_ACCESS_KEY_ID=<access_key> \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<secret_key>
#
# Те же credentials что у gdrive-sync-service (секрет gdrive-sync-minio-credentials).
# Если MinIO credentials уже в Vault, можно использовать ExternalSecret:
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: splitter-minio-credentials
  namespace: chessverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: splitter-minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: chessverse/minio
        property: access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: chessverse/minio
        property: secret_key

---
# ── 2. Cloudflare Access credentials ─────────────────────────────────────────
# Создать один раз:
#   kubectl create secret generic splitter-cf-access \
#     --namespace=chessverse \
#     --from-literal=CF_ACCESS_CLIENT_ID=<cf_client_id> \
#     --from-literal=CF_ACCESS_CLIENT_SECRET=<cf_client_secret>
#
# CF_ACCESS_CLIENT_ID и CF_ACCESS_CLIENT_SECRET — из Cloudflare Access
# (те же что в cursor-context-main/secrets/cloudflare-access.env)
apiVersion: v1
kind: Secret
metadata:
  name: splitter-cf-access
  namespace: chessverse
type: Opaque
stringData:
  CF_ACCESS_CLIENT_ID: "REPLACE_ME"
  CF_ACCESS_CLIENT_SECRET: "REPLACE_ME"

---
# ── 3. ConfigMap: config.json ─────────────────────────────────────────────────
# frame_mode и quality_level переопределяются env vars FRAME_MODE / QUALITY_LEVEL
# из K8s Job spec — этот ConfigMap задаёт только minio endpoint и bucket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: splitter-config
  namespace: chessverse
data:
  config.json: |
    {
      "show_progress": false,
      "use_video_files": true,
      "use_ffmpeg": false,
      "ffmpeg_path": "ffmpeg",
      "default_fps": 25,
      "frame_mode": "rare",
      "quality_level": "low",
      "quality_thresholds": {"low": 100, "medium": 50, "high": 30},
      "albumentations": {"enable": false},
      "save_png": false,
      "save_jpeg": true,
      "use_seek": true,
      "processes": 1,
      "log_level": "DEBUG",
      "minio": {
        "bucket_name": "chess-ai",
        "input_prefix": "video/",
        "output_prefix": "video/splitter_output",
        "endpoint_url": "https://s3.multiagent.vision",
        "poll_interval_sec": 300,
        "work_dir": "",
        "state_file": ""
      }
    }
